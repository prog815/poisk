; ============================================
; Конфигурация системы Poisk
; Версия формата конфигурации: 1.0
; 
; ВАЖНО: При обновлении системы этот файл НЕ перезаписывается.
; Администраторская конфигурация всегда сохраняется.
; 
; Репозиторий проекта: https://github.com/prog815/poisk
; ============================================

[PATHS]
# Каталоги для сканирования (полный_путь:КороткоеИмя)
# Пример: \\server\share\docs:Документы, /mnt/share/projects:Проекты
scan_directories = 

# Путь для сохранения страницы поиска (полный путь)
# Пример: \\server\share\search.html или /mnt/share/search.html
output_path = 

# ПОЛНЫЙ путь к файлу меню (если есть, опционально)
# Пример: \\server\share\menu.html или /mnt/share/menu.html
menu_file_path = 

[SETTINGS]
# Максимальное количество файлов для индексации (0 = без ограничений)
max_files = 200000

# Количество результатов на страницу
results_per_page = 10

# Расширения файлов для индексации (через запятую)
file_extensions = pdf,doc,docx,xls,xlsx,ppt,pptx,txt,py,js,html,css,java,cpp,h,zip,rar,7z

# Версия конфигурации (не изменяется администратором)
config_version = 1.0